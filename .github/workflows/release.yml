name: release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touchscreen-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test touchscreen firmware contracts
        run: python3 tools/test_touchscreen_contracts.py
      - name: Check touchscreen firmware invariants
        run: python3 tools/check_touchscreen_firmware.py

  # ---- ESP32 Wi-Fi bridge flavors (ESP-IDF v6.0.1) ----------------------------
  esp32:
    needs: touchscreen-invariants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: headless
            sdkconfig: sdkconfig.headless
            defaults: sdkconfig.defaults\;sdkconfig.defaults.headless
            target: esp32s3
            chip: esp32s3
            bootloader_offset: '0x0'
            flash_freq: 80m
            image: ganymede-bridge-headless-esp32s3.bin
          - flavor: touchscreen
            sdkconfig: sdkconfig.touchscreen
            defaults: sdkconfig.defaults\;sdkconfig.defaults.touchscreen
            target: esp32
            chip: esp32
            bootloader_offset: '0x1000'
            flash_freq: 40m
            image: ganymede-bridge-touchscreen-esp32.bin
    steps:
      - uses: actions/checkout@v4
      - name: Build + merge ${{ matrix.flavor }} single flashable image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: firmware/esp32_bridge
          # Build, then merge bootloader+partitions+app into one image flashable at 0x0
          # (offsets from build/flasher_args.json; flash settings dio/80m/2MB).
          command: >-
            idf.py -B build-${{ matrix.flavor }}
            -DSDKCONFIG=${{ matrix.sdkconfig }}
            -DSDKCONFIG_DEFAULTS=${{ matrix.defaults }}
            build &&
            esptool --chip ${{ matrix.chip }} merge-bin -o ${{ matrix.image }} -f raw
            --flash-mode dio --flash-freq ${{ matrix.flash_freq }} --flash-size 2MB
            ${{ matrix.bootloader_offset }} build-${{ matrix.flavor }}/bootloader/bootloader.bin
            0x8000 build-${{ matrix.flavor }}/partition_table/partition-table.bin
            0x10000 build-${{ matrix.flavor }}/ganymede_bridge.bin &&
            if [ "${{ matrix.flavor }}" = "headless" ]; then
              cp ${{ matrix.image }} ganymede-bridge-esp32s3.bin;
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.flavor }}
          path: firmware/esp32_bridge/ganymede-bridge*esp32*.bin

  # ---- nRF52840 BLE emulator (nRF Connect SDK v2.7.0, out-of-tree board) ------
  # Builds with the git-ignored clone_addr.h ABSENT, so the firmware falls back to
  # clone_addr.h.example (generic Cypress-OUI address 00:A0:50:00:00:01) — pairs by
  # fresh-pairing with any De'Longhi AC.
  nrf:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Initialise NCS v2.7.0 workspace
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.7.0 ncs
          cd ncs && west update --narrow -o=--depth=1
          west zephyr-export
      - name: Build emulator
        working-directory: ncs
        run: |
          APP="$GITHUB_WORKSPACE/project/firmware/nrf52_emulator/zephyr"
          west build -b nice_nano/nrf52840 "$APP" -d build_ncs -- -DBOARD_ROOT="$APP"
          cp build_ncs/zephyr/zephyr.uf2 "$GITHUB_WORKSPACE/ganymede-emulator-nrf52840.uf2"
      - name: Fetch the nRF bootloader-update UF2 (no-SoftDevice, one-time upgrade)
        # The Zephyr CI container has no curl/wget; python3 is always present.
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://github.com/adafruit/Adafruit_nRF52_Bootloader/releases/download/0.9.2/update-nice_nano_bootloader-0.9.2_nosd.uf2"
          urllib.request.urlretrieve(url, "update-nice_nano_bootloader-0.9.2_nosd.uf2")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nrf
          path: |
            ganymede-emulator-nrf52840.uf2
            update-nice_nano_bootloader-0.9.2_nosd.uf2

  # ---- collect artifacts + publish the GitHub Release -------------------------
  release:
    needs: [esp32, nrf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten + checksums
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
