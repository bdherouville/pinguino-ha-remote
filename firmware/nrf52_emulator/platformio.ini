; Ganymede emulator — nRF52840 (Adafruit nRF52 core → Bluefruit: Bluefruit.*, BLEService...).
;
;   pio run                     # compile (first run downloads the Adafruit core + ARM toolchain)
;   pio run -t upload           # flash (UF2: double-tap RESET first if needed)
;   pio device monitor -b 115200
;
; Board note: the target is a generic "nRF52840 Pro Micro / SuperMini" (Nice!Nano form
; factor, UF2 bootloader). The official nordicnrf52 platform has no 'nicenano' id, so we
; build against 'adafruit_feather_nrf52840' — same nRF52840 + Adafruit Bluefruit core; the
; UF2 runs on the Pro Micro because this firmware uses only the radio (no board-specific
; pins). For an exact Pro Micro pinout later, add a custom board JSON (à la ZMK nice_nano).

[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
