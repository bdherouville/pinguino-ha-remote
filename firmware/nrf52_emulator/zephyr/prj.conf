# ===== Ganymede emulator (Zephyr / nice!nano) =====

# ---- BLE peripheral identity ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Ganymede"
# 0x03C1 = HID Keyboard
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2

# ---- Pairing gate ----
# Using Nordic's SoftDevice Controller (sdc), which works on this board but
# (unlike the open-source controller) has no Company-ID override -> it reports
# Nordic 0x0059 in LL_VERSION_IND. We fake the Cypress identity via the public
# address OUI 00:A0:50 (bt_ctlr_set_public_addr, in main) and test whether the
# AC's gate is the OUI rather than the Company ID.

# ---- SMP: Just Works, NoInputNoOutput, bonding, no MITM/SC ----
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ---- GATT: HID + Battery + Env Sensing + Device Info ----
CONFIG_BT_GATT_DYNAMIC_DB=y
# Match the real remote's small GAP(7)/GATT(4): drop caching (Database Hash +
# Client Supported Features) and Central Address Resolution.
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF="De'Longhi"
CONFIG_BT_DIS_MODEL="Ganymede"
# PnP ID with the Cypress VID — the AC may check this to trust the remote (see
# docs/ganymede_protocol.md). VID source 1 = Bluetooth SIG; 0x0131 = Cypress.
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=1
CONFIG_BT_DIS_PNP_VID=0x0131
CONFIG_BT_DIS_PNP_PID=0x0001
CONFIG_BT_DIS_PNP_VER=0x0100

# ---- ESP32 bridge UART (uart0, P0.20/P0.22) — interrupt-driven so we don't
#      drop bytes mid-line at 115200 (poll mode + k_msleep raced the FIFO) ----
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# ---- USB CDC ACM shell for `emu press`, `emu status`, ... ----
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PID=0x000a
CONFIG_USB_DEVICE_PRODUCT="Ganymede-Emu"
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# ---- logging ----
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_REBOOT=y
